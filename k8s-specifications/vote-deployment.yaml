apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    app: vote

spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote

  template:
    metadata:
      labels:
        app: vote

    spec:
      containers:
      - name: vote
        image: cloudvotingacr.azurecr.io/vote:latest   # pipeline will update tag

        ports:
        - containerPort: 80

        env:
        - name: REDIS_HOST
          value: redis
