parameters:
- name: serviceName
  type: string

- name: servicePath
  type: string

variables:
  acrLoginServer: 'cloudvotingacr.azurecr.io'
  imageRepository: '${{ parameters.serviceName }}'
  tag: '$(Build.BuildId)'

stages:
- stage: BuildPushAndUpdate
  displayName: Build, Push & Update

  jobs:
  - job: BuildPushUpdate
    pool:
      name: 'devops-agent-pool'

    steps:

    - checkout: self
      persistCredentials: true

    # 🔥 Build & Push (force fresh image)
    - task: Docker@2
      displayName: Build and Push Image
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(Build.SourcesDirectory)/${{ parameters.servicePath }}/Dockerfile
        containerRegistry: 'acr-connection'
        tags: |
          $(tag)
        arguments: --no-cache

    # 🔥 Update manifest
    - script: |
        sed -i 's/\r$//' $(Build.SourcesDirectory)/scripts/updatek8smanifest.sh
        chmod +x $(Build.SourcesDirectory)/scripts/updatek8smanifest.sh

        bash $(Build.SourcesDirectory)/scripts/updatek8smanifest.sh \
        ${{ parameters.serviceName }} \
        $(acrLoginServer)/$(imageRepository) \
        $(tag)
      displayName: Update Manifest

    # 🔥 Commit YAML
    - script: |
        cd $BUILD_SOURCESDIRECTORY

        git config user.email "devops@azure.com"
        git config user.name "azure-pipeline"

        git stash || echo "Nothing to stash"
        git pull origin main --rebase
        git stash pop || echo "Nothing to pop"

        git add k8s-specifications/${{ parameters.serviceName }}-deployment.yaml
        git commit -m "[skip ci] Update ${{ parameters.serviceName }} image to $(tag)" || echo "No changes"

        git push origin HEAD:main
      displayName: Commit YAML

    # 🔥 Restart deployment
    - script: |
        kubectl rollout restart deployment ${{ parameters.serviceName }} || true
      displayName: Restart Deployment
